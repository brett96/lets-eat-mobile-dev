name: lets_eat
description: "Let's Eat! — restaurant suggestions powered by Yelp."
publish_to: "none"

version: 2.0.0+6

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  firebase_messaging: ^15.2.5

  # Sign-in
  google_sign_in: ^6.3.0
  sign_in_with_apple: ^6.1.4
  crypto: ^3.0.6

  # Location & maps
  geolocator: ^14.0.0
  google_maps_flutter: ^2.12.1

  # Networking & utilities
  http: ^1.3.0
  url_launcher: ^6.3.1
  provider: ^6.1.5
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/

# App launcher icons. Regenerate with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/ACTUALAPPLOGO.png"
  android: "ic_launcher"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/ACTUALAPPLOGO.png"
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 23
